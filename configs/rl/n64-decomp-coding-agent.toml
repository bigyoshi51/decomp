# Prime-RL current unified config. Launch from this repository root with:
# uv run --project /path/to/prime-rl rl @ configs/rl/n64-decomp-coding-agent.toml
max_steps = 200
seq_len = 32768

[model]
name = "Qwen/Qwen3-30B-A3B-Instruct-2507"

[wandb]
project = "n64-decomp-v1"
name = "coding-agent"

[trainer.model]
impl = "auto"

[trainer.model.ac]
freq = 1

[trainer.model.lora]
rank = 32
alpha = 64

[trainer.optim]
lr = 1e-5

[orchestrator]
batch_size = 128
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 16384

[[orchestrator.train.env]]
name = "n64-decomp-coding-agent"
env.taskset = { id = "n64-decomp-v1", project_root = "projects/1080-decomp", profile = "project_profiles/1080.yaml", manifest = "exports/1080-v1/tasks.audited.jsonl", split = "train", mode = "coding_agent" }
env.agent.max_turns = 30
env.agent.timeout = { setup = 300, rollout = 1800, scoring = 300 }
env.agent.harness = { id = "bash", runtime = { type = "docker" } }

[orchestrator.eval]
interval = 20

[[orchestrator.eval.env]]
name = "n64-decomp-coding-agent-validation"
num_examples = 32
env.taskset = { id = "n64-decomp-v1", project_root = "projects/1080-decomp", profile = "project_profiles/1080.yaml", manifest = "exports/1080-v1/tasks.audited.jsonl", split = "validation", mode = "coding_agent" }
env.agent.max_turns = 30
env.agent.harness = { id = "bash", runtime = { type = "docker" } }

[inference]
