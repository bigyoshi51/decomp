# Run from the decomp repository root after building the verifier image.
# uv run --project environments/n64_decomp_v1 eval \
#   @ configs/eval/n64-decomp-coding-agent.toml --model <endpoint-model>
num_tasks = 10
num_rollouts = 1
max_turns = 30
max_output_tokens = 16384

[taskset]
id = "n64-decomp-v1"
project_root = "projects/1080-decomp"
profile = "project_profiles/1080.yaml"
manifest = "exports/1080-v1/tasks.audited.jsonl"
split = "test"
mode = "coding_agent"

[harness]
id = "default"
runtime = { type = "docker" }
